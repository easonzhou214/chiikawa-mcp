<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="吉伊卡哇 剧情资料站">
  <title>吉伊卡哇 剧情资料站</title>
  <!--
    站点的图标。

    为什么不用 assets/images/logo-chiikawa.png：那是一块 1100×341 的粉底白字
    长方形（没有透明背景），本身是「文字标识」而不是图标。塞进方形的标签页里
    只能被压成一条粉带，所以之前一直是糊的。

    这里自己画一个矢量图标，不裁官方素材，也不画角色脸 —— 只用轮廓：
    粉底圆角方块 + 两只耳朵 + 一个圆脑袋。轮廓没有五官，就不涉及「代画角色形象」，
    和站内占位符的处理原则一致。

    16px 下能看清的只有「粉方块 + 白色圆 + 两只耳朵」这三层，所以图案保持极简；
    颜色取自站点自己的调色板里的粉色与米白。

    注：XML 注释里不能出现连续两个减号，所以上面别写 CSS 变量名。
  -->
  <rect width="64" height="64" rx="15" fill="#E4698F"/>
  <g fill="#FFFFFF">
    <ellipse cx="23" cy="20" rx="5.6" ry="14.5" transform="rotate(-9 23 20)"/>
    <ellipse cx="41" cy="20" rx="5.6" ry="14.5" transform="rotate(9 41 20)"/>
    <ellipse cx="32" cy="41" rx="17.5" ry="16"/>
  </g>
</svg>
